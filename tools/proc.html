<!DOCTYPE html><meta charset="utf-8"><title>proc</title>
<style>body{margin:0;background:#fff;font-family:sans-serif}canvas{max-width:100%}</style>
<div id="info"></div><canvas id="c"></canvas>
<script>
// Label eraser for scanned atlas plates: finds text-line groups on white background outside the drawing, erases them, returns their centers.
async function loadImg(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function process(im, opts){
  const o=Object.assign({thr:150, maxGlyphH:60, minGlyphH:5, maxGlyphW:120, gapX:1.7, gapY:0.6, whiteRatio:0.8, minGlyphs:2, wRatio:1.2, pad:10, keepRects:[], eraseRects:[]}, opts||{});
  const W=im.naturalWidth, H=im.naturalHeight;
  const c=document.getElementById('c'); c.width=W; c.height=H; const ctx=c.getContext('2d'); ctx.drawImage(im,0,0);
  const id=ctx.getImageData(0,0,W,H), d=id.data;
  const ink=new Uint8Array(W*H); const gray=new Uint8Array(W*H);
  for(let i=0,p=0;i<W*H;i++,p+=4){ const g=(d[p]*0.3+d[p+1]*0.59+d[p+2]*0.11)|0; gray[i]=g; ink[i]=g<o.thr?1:0; }
  // connected components (8-conn) with bbox
  const lab=new Int32Array(W*H); let n=0; const comps=[]; const stack=new Int32Array(W*H);
  for(let i=0;i<W*H;i++){ if(!ink[i]||lab[i]) continue; n++; let sp=0; stack[sp++]=i; lab[i]=n; let minx=W,maxx=0,miny=H,maxy=0,area=0;
    while(sp){ const q=stack[--sp]; const x=q%W, y=(q/W)|0; area++; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
      for(let dy=-1;dy<=1;dy++){ const yy=y+dy; if(yy<0||yy>=H) continue; for(let dx=-1;dx<=1;dx++){ const xx=x+dx; if(xx<0||xx>=W) continue; const j=yy*W+xx; if(ink[j]&&!lab[j]){ lab[j]=n; stack[sp++]=j; } } } }
    comps.push({id:n,minx,maxx,miny,maxy,area,w:maxx-minx+1,h:maxy-miny+1}); }
  // glyph candidates
  const gl=comps.filter(k=>k.h>=o.minGlyphH&&k.h<=o.maxGlyphH&&k.w<=o.maxGlyphW&&k.area>=4);
  gl.sort((a,b)=>a.miny-b.miny||a.minx-b.minx);
  // group into lines: same row (vertical overlap) and horizontal gap < gapX*h
  const lines=[]; const used=new Uint8Array(gl.length);
  for(let i=0;i<gl.length;i++){ if(used[i]) continue; const L={g:[gl[i]],minx:gl[i].minx,maxx:gl[i].maxx,miny:gl[i].miny,maxy:gl[i].maxy}; used[i]=1; let grew=true;
    while(grew){ grew=false; const hh=L.maxy-L.miny+1; for(let j=0;j<gl.length;j++){ if(used[j]) continue; const g=gl[j]; const vo=Math.min(L.maxy,g.maxy)-Math.max(L.miny,g.miny); if(vo< Math.min(hh,g.h)*0.4) continue; const gap=Math.max(g.minx-L.maxx, L.minx-g.maxx); if(gap>o.gapX*Math.max(hh,g.h)) continue; L.g.push(g); used[j]=1; L.minx=Math.min(L.minx,g.minx); L.maxx=Math.max(L.maxx,g.maxx); L.miny=Math.min(L.miny,g.miny); L.maxy=Math.max(L.maxy,g.maxy); grew=true; } } lines.push(L); }
  // text lines: >=3 glyphs, glyph heights fairly uniform, and on white background
  const isWhiteAround=(L)=>{ const x0=Math.max(0,L.minx-o.pad),x1=Math.min(W-1,L.maxx+o.pad),y0=Math.max(0,L.miny-o.pad),y1=Math.min(H-1,L.maxy+o.pad); let tot=0,wh=0; const own=new Set(L.g.map(g=>g.id));
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const i=y*W+x; if(ink[i]&&own.has(lab[i])) continue; tot++; if(gray[i]>200) wh++; } return tot? wh/tot : 0; };
  const text=lines.filter(L=>{ if(L.g.length<o.minGlyphs) return false; const hs=L.g.map(g=>g.h).sort((a,b)=>a-b); const med=hs[hs.length>>1]; if(med<o.minGlyphH+2) return false; const w=L.maxx-L.minx+1, h=L.maxy-L.miny+1; if(w<h*o.wRatio) return false; if(L.g.length>60) return false; L.white=isWhiteAround(L); if(L.white<o.whiteRatio) return false;
    const cx=(L.minx+L.maxx)/2, cy=(L.miny+L.maxy)/2; for(const r of o.keepRects) if(cx>=r[0]&&cx<=r[2]&&cy>=r[1]&&cy<=r[3]) return false; return true; });
  // merge lines into blocks (multi-line labels): horizontal overlap and vertical gap < gapY*h
  text.sort((a,b)=>a.miny-b.miny);
  const blocks=[]; const bu=new Uint8Array(text.length);
  for(let i=0;i<text.length;i++){ if(bu[i]) continue; const B={lines:[text[i]],minx:text[i].minx,maxx:text[i].maxx,miny:text[i].miny,maxy:text[i].maxy}; bu[i]=1; let grew=true;
    while(grew){ grew=false; for(let j=0;j<text.length;j++){ if(bu[j]) continue; const t=text[j]; const h=Math.max(t.maxy-t.miny+1,B.lines[0].maxy-B.lines[0].miny+1); const ho=Math.min(B.maxx,t.maxx)-Math.max(B.minx,t.minx); if(ho<0) continue; const vg=Math.max(t.miny-B.maxy,B.miny-t.maxy); if(vg>o.gapY*h) continue; B.lines.push(t); bu[j]=1; B.minx=Math.min(B.minx,t.minx); B.maxx=Math.max(B.maxx,t.maxx); B.miny=Math.min(B.miny,t.miny); B.maxy=Math.max(B.maxy,t.maxy); grew=true; } } blocks.push(B); }
  // erase: paint white over each text line bbox (+2px)
  ctx.fillStyle='#fff'; for(const r of o.eraseRects){ ctx.fillRect(r[0]/100*W, r[1]/100*H, (r[2]-r[0])/100*W, (r[3]-r[1])/100*H); }
  const ringOk=(x0,y0,x1,y1)=>{ let s=0,nn=0; for(let x=x0;x<=x1;x+=3){ for(const y of [y0,y1]){ if(x<0||x>=W||y<0||y>=H) continue; s+=gray[(y|0)*W+(x|0)]>=222?1:0; nn++; } } for(let y=y0;y<=y1;y+=3){ for(const x of [x0,x1]){ if(x<0||x>=W||y<0||y>=H) continue; s+=gray[(y|0)*W+(x|0)]>=222?1:0; nn++; } } return nn? s/nn>=0.9 : false; };
  window.__ringOk=ringOk; window.__gray=gray; window.__W=W; window.__H=H;
  let skippedGlyph=0;
  for(const L of text){ let done=false; for(const pad of [10,6,3,1]){ if(ringOk(L.minx-pad-2,L.miny-pad-2,L.maxx+pad+2,L.maxy+pad+2)){ ctx.fillRect(L.minx-pad,L.miny-pad,L.maxx-L.minx+2*pad+1,L.maxy-L.miny+2*pad+1); done=true; break; } } if(!done) skippedGlyph++; }
  const linesOut=text.map((L,i)=>({i:i+1,x:+(((L.minx+L.maxx)/2)/W*100).toFixed(2),y:+(((L.miny+L.maxy)/2)/H*100).toFixed(2),x0:+(L.minx/W*100).toFixed(2),x1:+(L.maxx/W*100).toFixed(2),y0:+(L.miny/H*100).toFixed(2),y1:+(L.maxy/H*100).toFixed(2)}));
  // white-point: lift light-gray paper/bleed-through to white
  if(o.white!==false){ const id2=ctx.getImageData(0,0,W,H), d2=id2.data; const lo=o.wlo||175, hi=o.whi||205;
    for(let p=0;p<d2.length;p+=4){ const g=(d2[p]*0.3+d2[p+1]*0.59+d2[p+2]*0.11); if(g>=hi){ d2[p]=d2[p+1]=d2[p+2]=255; } else if(g>lo){ const k=(g-lo)/(hi-lo); const t=lo+k*(255-lo); const f=t/g; d2[p]=Math.min(255,d2[p]*f); d2[p+1]=Math.min(255,d2[p+1]*f); d2[p+2]=Math.min(255,d2[p+2]*f); } }
    ctx.putImageData(id2,0,0); }
  const out=blocks.map((B,i)=>({i:i+1,x:+(((B.minx+B.maxx)/2)/W*100).toFixed(2),y:+(((B.miny+B.maxy)/2)/H*100).toFixed(2),w:B.maxx-B.minx,h:B.maxy-B.miny,lines:B.lines.length}));
  return {W,H,blocks:out,lines:linesOut,textLines:text.length,comps:comps.length};
}
async function run(file, opts, outName, maxW){
  const im=await loadImg('sobo/'+encodeURIComponent(file)); const r=process(im,opts);
  const c=document.getElementById('c');
  // export cleaned (downscaled) jpeg
  const scale=Math.min(1,(maxW||1600)/c.width); const c2=document.createElement('canvas'); c2.width=Math.round(c.width*scale); c2.height=Math.round(c.height*scale); c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
  const blob=await new Promise(res=>c2.toBlob(res,'image/jpeg',0.86));
  await fetch('http://127.0.0.1:8767/save?name='+encodeURIComponent(outName+'.jpg'),{method:'POST',body:blob});
  // marker preview
  const ctx2=c2.getContext('2d'); ctx2.font='bold 28px sans-serif';
  ctx2.font='bold 22px sans-serif'; for(const b of r.lines){ const x=b.x/100*c2.width,y=b.y/100*c2.height; ctx2.fillStyle='#e11'; ctx2.beginPath(); ctx2.arc(x,y,16,0,7); ctx2.fill(); ctx2.fillStyle='#fff'; ctx2.textAlign='center'; ctx2.textBaseline='middle'; ctx2.fillText(String(b.i),x,y); }
  const blob2=await new Promise(res=>c2.toBlob(res,'image/jpeg',0.7));
  await fetch('http://127.0.0.1:8767/save?name='+encodeURIComponent(outName+'.marks.jpg'),{method:'POST',body:blob2});
  document.getElementById('info').textContent=JSON.stringify(r);
  return r;
}

async function runOcr(n, outName, opts){
  opts=opts||{}; const j=await (await fetch('ocr/'+n+'.json?'+Date.now())).json();
  const im=await loadImg('sobo/'+encodeURIComponent('Sobo 1909 '+n+'.png'));
  const W=im.naturalWidth,H=im.naturalHeight; const c=document.getElementById('c'); c.width=W; c.height=H; const ctx=c.getContext('2d'); ctx.drawImage(im,0,0);
  ctx.fillStyle='#fff';
  for(const l of j.lines){ const x0=l[0]/100*W,y0=l[1]/100*H,x1=l[2]/100*W,y1=l[3]/100*H; const h=y1-y0, pad=Math.max(8,h*0.35); ctx.fillRect(x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad); }
  for(const r of (opts.eraseRects||[])) ctx.fillRect(r[0]/100*W,r[1]/100*H,(r[2]-r[0])/100*W,(r[3]-r[1])/100*H);
  // white-point
  const id2=ctx.getImageData(0,0,W,H), d2=id2.data; const lo=opts.wlo||205, hi=opts.whi||235;
  for(let p=0;p<d2.length;p+=4){ const g=(d2[p]*0.3+d2[p+1]*0.59+d2[p+2]*0.11); if(g>=hi){ d2[p]=d2[p+1]=d2[p+2]=255; } else if(g>lo){ const k=(g-lo)/(hi-lo); const t=lo+k*(255-lo); const f=t/g; d2[p]=Math.min(255,d2[p]*f); d2[p+1]=Math.min(255,d2[p+1]*f); d2[p+2]=Math.min(255,d2[p+2]*f); } }
  ctx.putImageData(id2,0,0);
  const maxW=opts.maxW||1600; const scale=Math.min(1,maxW/W); const c2=document.createElement('canvas'); c2.width=Math.round(W*scale); c2.height=Math.round(H*scale); c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
  const blob=await new Promise(res=>c2.toBlob(res,'image/jpeg',0.86)); await fetch('http://127.0.0.1:8767/save?name='+encodeURIComponent(outName+'.jpg'),{method:'POST',body:blob});
  const ctx2=c2.getContext('2d'); ctx2.font='bold 22px sans-serif'; ctx2.textAlign='center'; ctx2.textBaseline='middle';
  j.blocks.forEach((b,i)=>{ const x=b.x/100*c2.width,y=b.y/100*c2.height; ctx2.fillStyle='#e11'; ctx2.beginPath(); ctx2.arc(x,y,17,0,7); ctx2.fill(); ctx2.fillStyle='#fff'; ctx2.fillText(String(i+1),x,y); });
  const blob2=await new Promise(res=>c2.toBlob(res,'image/jpeg',0.7)); await fetch('http://127.0.0.1:8767/save?name='+encodeURIComponent(outName+'.marks.jpg'),{method:'POST',body:blob2});
  return {W:c2.width,H:c2.height,blocks:j.blocks.length};
}

async function runOcr2(n, outName, opts){
  opts=opts||{}; const j=await (await fetch('ocr/'+n+'.json?'+Date.now())).json();
  const im=await loadImg('sobo/'+encodeURIComponent('Sobo 1909 '+n+'.png'));
  const W=im.naturalWidth,H=im.naturalHeight;
  const c0=document.createElement('canvas'); c0.width=W; c0.height=H; const ctx0=c0.getContext('2d'); ctx0.drawImage(im,0,0); const d0=ctx0.getImageData(0,0,W,H).data;
  const gray=(x,y)=>{ x=Math.max(0,Math.min(W-1,x|0)); y=Math.max(0,Math.min(H-1,y|0)); const p=(y*W+x)*4; return d0[p]*0.3+d0[p+1]*0.59+d0[p+2]*0.11; };
  const ringWhite=(x0,y0,x1,y1)=>{ let s=0,nn=0; const step=3; for(let x=x0-12;x<=x1+12;x+=step){ for(const y of [y0-12,y0-6,y1+6,y1+12]){ s+=gray(x,y)>=225?1:0; nn++; } } for(let y=y0;y<=y1;y+=step){ for(const x of [x0-12,x0-6,x1+6,x1+12]){ s+=gray(x,y)>=225?1:0; nn++; } } return nn?s/nn:0; };
  const r=process(im,Object.assign({minGlyphH:10,white:false},opts)); // glyph-based erase on canvas #c
  const c=document.getElementById('c'); const ctx=c.getContext('2d'); ctx.fillStyle='#fff';
  let skipped=0;
  for(const l of j.lines){ const x0=l[0]/100*W,y0=l[1]/100*H,x1=l[2]/100*W,y1=l[3]/100*H; const h=y1-y0; let done=false; for(const pad of [Math.max(10,h*0.35),8,4,2]){ if(window.__ringOk(x0-pad-2,y0-pad-2,x1+pad+2,y1+pad+2)){ ctx.fillRect(x0-pad,y0-pad,x1-x0+2*pad,y1-y0+2*pad); done=true; break; } } if(!done) skipped++; }
  for(const rr of (opts.eraseRects||[])) ctx.fillRect(rr[0]/100*W,rr[1]/100*H,(rr[2]-rr[0])/100*W,(rr[3]-rr[1])/100*H);
  const id2=ctx.getImageData(0,0,W,H), d2=id2.data; const lo=opts.wlo||205, hi=opts.whi||235;
  for(let p=0;p<d2.length;p+=4){ const g=(d2[p]*0.3+d2[p+1]*0.59+d2[p+2]*0.11); if(g>=hi){ d2[p]=d2[p+1]=d2[p+2]=255; } else if(g>lo){ const k=(g-lo)/(hi-lo); const t=lo+k*(255-lo); const f=t/g; d2[p]=Math.min(255,d2[p]*f); d2[p+1]=Math.min(255,d2[p+1]*f); d2[p+2]=Math.min(255,d2[p+2]*f); } }
  ctx.putImageData(id2,0,0);
  const maxW=opts.maxW||1600; const scale=Math.min(1,maxW/W); const c2=document.createElement('canvas'); c2.width=Math.round(W*scale); c2.height=Math.round(H*scale); c2.getContext('2d').drawImage(c,0,0,c2.width,c2.height);
  const blob=await new Promise(res=>c2.toBlob(res,'image/jpeg',0.86)); await fetch('http://127.0.0.1:8767/save?name='+encodeURIComponent(outName+'.jpg'),{method:'POST',body:blob});
  const ctx2=c2.getContext('2d'); ctx2.font='bold 22px sans-serif'; ctx2.textAlign='center'; ctx2.textBaseline='middle';
  j.blocks.forEach((b,i)=>{ const x=b.x/100*c2.width,y=b.y/100*c2.height; ctx2.fillStyle='#e11'; ctx2.beginPath(); ctx2.arc(x,y,17,0,7); ctx2.fill(); ctx2.fillStyle='#fff'; ctx2.fillText(String(i+1),x,y); });
  const blob2=await new Promise(res=>c2.toBlob(res,'image/jpeg',0.7)); await fetch('http://127.0.0.1:8767/save?name='+encodeURIComponent(outName+'.marks.jpg'),{method:'POST',body:blob2});
  return {W:c2.width,H:c2.height,blocks:j.blocks.length,glyphLines:r.textLines,skipped};
}
</script>
